name: Validate and draft release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]' build
      - name: Check version and release tag
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python scripts/release.py check --tag "$RELEASE_TAG"
      - run: python -m pytest -q
      - run: jellyorganize benchmark --output matching-report.json
      - run: python scripts/validate_storage.py --cycles 25 --output storage-report.json
      - run: python scripts/soak_incoming.py --cycles 3 --interval 0
      - run: python -m build
      - name: Prepare release files and checksums
        run: python scripts/release.py prepare --dist dist
      - name: Test clean wheel installation
        run: |
          python -m venv /tmp/jo-clean
          /tmp/jo-clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/jo-clean/bin/jellyorganize --version
          /tmp/jo-clean/bin/jellyorganize --config /tmp/jo-install.toml config init
          /tmp/jo-clean/bin/jellyorganize --config /tmp/jo-install.toml config show
          /tmp/jo-clean/bin/jellyorganize benchmark
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation-python-${{ matrix.python }}
          path: |
            dist/*
            matching-report.json
            storage-report.json
          if-no-files-found: error
  release:
    name: Create draft GitHub release
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-validation-python-3.13
          path: release-artifacts
      - name: Create or refresh the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts/dist
          sha256sum --check SHA256SUMS
          prerelease=false
          if [[ "$RELEASE_TAG" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease=true
          fi
          if gh release view "$RELEASE_TAG" --json isDraft >/tmp/release-state.json; then
            python -c 'import json; assert json.load(open("/tmp/release-state.json"))["isDraft"], "Published releases are immutable in this workflow; use a new version"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --prerelease="$prerelease" --latest=false \
              --title "Jellyorganize $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" ./*.whl ./*.tar.gz SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --prerelease="$prerelease" --notes-file RELEASE_NOTES.md
